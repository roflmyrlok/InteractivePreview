name: Deploy

on:
  push:
    branches: [main]
    # data-acquisition branch never triggers deploy — it only contains
    # the DataAcquisition/ batch pipeline, not any deployable service.

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_CONFIG: /tmp/docker-config-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          mkdir -p $DOCKER_CONFIG
          AUTH=$(echo -n "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" | base64)
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" > $DOCKER_CONFIG/config.json

      - name: Build and push UserService
        run: |
          docker build \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/userservice:${{ github.sha }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/userservice:latest \
            ./backend/UserService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/userservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/userservice:latest

      - name: Build and push LocationService
        run: |
          docker build \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/locationservice:${{ github.sha }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/locationservice:latest \
            ./backend/LocationService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/locationservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/locationservice:latest

      - name: Build and push ReviewService
        run: |
          docker build \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/reviewservice:${{ github.sha }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/reviewservice:latest \
            ./backend/ReviewService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reviewservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reviewservice:latest

      - name: Build and push SourceRegistryService
        run: |
          docker build \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/sourceregistryservice:${{ github.sha }} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/sourceregistryservice:latest \
            ./backend/SourceRegistryService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sourceregistryservice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sourceregistryservice:latest

      - name: Build admin SPA
        run: |
          cd admin-app
          npm ci
          npm run build
          # Copy built files into the admin-dist volume via a temp container
          docker run --rm \
            -v "$(pwd)/dist:/src" \
            -v "interactivepreview_admin-dist:/dst" \
            alpine sh -c "cp -r /src/. /dst/"

      - name: Pull and restart all services
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cp /Users/epyt/workspace/InteractivePreview/ci-cd/.env ci-cd/.env
          cd ci-cd
          docker-compose pull
          docker-compose up -d --force-recreate
